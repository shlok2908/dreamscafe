<html>
    <head>
        <title>Payment</title>
        <link rel="stylesheet" type="text/css" href="pay.css">
    </head>
    <body>
    <div class="container">
    <header>
        <h1>Payment</h1>
        <p>Choose payment method</p>
    </header>
    <form action="http://localhost/shlok/new2/successful.php" method="post">
    <div class="type">
        <input type="radio" name="radio" id="cards"> Pay with Debit/Credit/ATM Cards
        <div class="m">
            <span class="a"></span>
            <span class="b"></span>
            <span class="c"></span>
        </div>
        <br>
        <br>
         <!-- Credit Card info -->
         <div class="card-info" id="info">
            <h4>Credit card info</h4>
            <div>
                <div>
                    <label for="card-number">Card number</label>
                    <input type="number" id="card-number" name="card-number" placeholder="1234   5678   3456   2456">
                </div>
                <div class="p">
                    <p>Visa</p>
                </div>
            </div>
            <div>
                <label for="holder-name">Cardholder name</label>
                <input type="text" id="holder-name" placeholder="John Doe">
            </div>
            <div>
                <label for="exp">Expire date</label>
                <input type="month" id="exp" value="2021-05">
            </div>
            <div>
                <div>
                    <label for="cvv">Cvv</label>
                    <input type="text" id="cvv" placeholder="123">
                    <br><input type="submit" value="Proceed" id="process">
                </div>
            </div>
        </div>
      <br>
        <input class="n" type="radio" id="net-banking" name="radio"> Net Banking
        <br>
        <br>
        <div class="dropdown">
            <button class="dropbtn">Choose an option</button>
            <div class="dropdown-content">
              <a href="#">HDFC Bank</a>
              <a href="#">ICIC Bank</a>
              <a href="#">Kotak Bank</a>
            </div>
        </div>
        <br>
        <br>
        <input class="o" type="radio" id="upi-apps" name="radio"> Other UPI Apps
<div class="upi">
    <label for="upi_id" id="upi_id">Please enter your UPI ID</label><br>
    <input type="text" id="ex" placeholder="Ex: MobileNumber@upi">
    <input type="submit" value="Verify" id="Verify">
</div>
        <br>
        <br>
        <input class="d" type="radio" id="cod" name="radio"> Cash On Delivery<br>
        <input type="submit" value="Submit" id="cod_submit" class="cod_submit">
    </div>
</div>
    </div>
    </div>
</form>
    </body>
    </html>
